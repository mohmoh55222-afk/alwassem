<style>

.sh .nb{margin-right:auto;border:0;border-radius:22px;padding:10px 16px;color:#fff;font-weight:700;background:linear-gradient(90deg,#8b5cf6,#22b8e0);cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rcard{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;border:1px solid #ffffff22}
.rcard.mine{border:2px solid #f5a623;box-shadow:0 0 14px #f5a62366}
.big{font-size:64px}
.rn{position:absolute;left:8px;right:8px;bottom:8px;background:#000a;border-radius:12px;padding:8px 10px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{position:absolute;top:8px;left:8px;background:#0008;border-radius:10px;padding:3px 8px;font-size:12px}
.own{position:absolute;top:8px;right:8px;background:#f5a623;color:#1a1300;border-radius:10px;padding:3px 8px;font-size:12px;font-weight:700}
.nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:26px;background:linear-gradient(90deg,#3a1d78ee,#6d28d9cc);border:1px solid #a78bfa55;padding-bottom:0}
.nav button{padding:8px 4px}.nav .ni{font-size:22px}.nav .nl{font-size:12px}.nav button.on{color:#fff}.nav button.on .ni{filter:drop-shadow(0 0 6px #fff)}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:8}
.sheet{width:100%;max-width:560px;border-radius:20px 20px 0 0;margin:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}

#splash{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:9;transition:opacity .5s}
#splash img{width:min(78vw,360px);border-radius:12%;box-shadow:0 0 50px #f5c54255;animation:pop .9s ease both}
@keyframes pop{from{transform:scale(.82);opacity:0}to{transform:none;opacity:1}}
.logo{display:block;width:160px;height:160px;margin:0 auto 10px;border-radius:22%;box-shadow:0 0 28px #f5c54244}
</style>
</head>

const logoImg=()=>{const i=el("img","logo");i.src=LOGO;return i};
const GIFTS=[["🎈","بالون",5],["🌹","وردة",10],["🍫","شوكولاتة",15],["☕","قهوة",25],["🧸","دبدوب",50],["👑","تاج",100],["💎","ألماسة",200],
  ["🚀","صاروخ",500],["💍","خاتم",800],["🦁","أسد",1000],["🐎","حصان",1500],["🏆","كأس",2000],["🏰","قلعة",3000],

const ROOM_PRICE=50, EMOJIS=["😎","🦁","🦅","🐎","🌙","⭐","🔥","🎯"];
let db,user,uid,prof,coins=0,tab="rooms",room=null,unsubRooms=null,unsubMsgs=null,rooms=[],msgs=[];
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const walletRef=()=>db.doc("data/users/"+uid+"/wallet");

async function main(){
  $("#splash img").src=LOGO;
  setTimeout(()=>{const s=$("#splash");if(s){s.style.opacity=0;setTimeout(()=>s.remove(),500)}},1600);
  try{ user=await claude.use("user"); db=await claude.use("db"); }catch(e){}
  if(!db||!user){ $("#app").innerHTML="";
    const c=el("div","card","لتجربة التطبيق افتح الرابط من حسابك في Claude. الحالة المشتركة (الغرف والدردشة) تحتاج تسجيل الدخول."); $("#app").append(c); return; }
  uid=await user.id(); OWNER=!!(await user.isOwner());
  const p=await db.doc("profiles/"+uid).get();
  if(p.exists){prof=p.data(); await loadWallet(); start();} else signup();
}
async function loadWallet(){
  if(OWNER){ coins=1e12; return; }
  const w=await walletRef().get();
  if(w.exists) coins=w.data().coins||0; else { coins=0; await walletRef().set({coins:0,granted:0}); }
}
async function setCoins(n){ if(OWNER){coins=1e12; return;} coins=n; await walletRef().set({coins:n}); }

function signup(){
  const a=$("#app"); a.innerHTML="";
  const c=el("div","card"); c.append(logoImg(),el("div","brand","AL WASEEM"),el("h2",null,"مرحباً بك 👋"),el("p","mut","اختر اسماً وستحصل على ID خاص بك."));
  const inp=el("input"); inp.placeholder="اسمك"; inp.maxLength=20;
  const b=el("button","btn full","ابدأ"); 
  b.onclick=async()=>{ const name=inp.value.trim(); if(!name) return;
    prof={name,pid:1000000+Math.floor(Math.random()*9000000),emoji:EMOJIS[Math.floor(Math.random()*EMOJIS.length)]};
    await db.doc("profiles/"+uid).set(prof); await loadWallet(); start(); };
  c.append(inp,b); a.append(c);
}
let unsubGrant=null;

function photoFrom(file,W=256,H=256){return new Promise((res,rej)=>{const r=new FileReader(); r.onerror=rej;
  r.onload=()=>{const im=new Image(); im.onerror=rej; im.onload=()=>{const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
    const k=Math.max(W/im.width,H/im.height), sw=W/k, sh=H/k;
    cv.getContext("2d").drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,W,H); res(cv.toDataURL("image/jpeg",0.8))}; im.src=r.result};
  r.readAsDataURL(file)})}

    if(tot>claimed){ coins=(w.exists?(w.data().coins||0):0)+(tot-claimed); await walletRef().set({coins,granted:tot}); toast("🪙 أُضيفت "+(tot-claimed)+" عملة إلى رصيدك"); render(); } }
  finally{ claiming=false; } }

let T3=null;

function tone(type,f0,f1,dur,vol){ if(!soundOn) return;
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume();
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime; o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.02); }catch(e){} }
function noise(dur,vol,f0,f1){ if(!soundOn) return;
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume();
    const n=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    const src=AC.createBufferSource(), fl=AC.createBiquadFilter(), g=AC.createGain(), t=AC.currentTime; src.buffer=buf; fl.type="lowpass";
    fl.frequency.setValueAtTime(f0,t); fl.frequency.exponentialRampToValueAtTime(f1,t+dur); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(fl); fl.connect(g); g.connect(AC.destination); src.start(t); }catch(e){} }

async function play3D(kind){

  const THREE=window.THREE, W=innerWidth, H=innerHeight, cv=document.createElement("canvas"); cv.className="fx3d"; document.body.append(cv);
  let r; try{ r=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true}); }catch(e){ cv.remove(); return fb(); }

  const B=c=>new THREE.MeshBasicMaterial({color:c});

    const car=new THREE.Group(); car.scale.setScalar(1.25); car.rotation.y=-.38;
    const add=(m,x,y,z)=>{ m.position.set(x,y,z); car.add(m); return m; };

    add(new THREE.Mesh(new THREE.BoxGeometry(1.9,.08,1.5),M(0xdc2626)),-.1,1.83,0);
    [-.5,.5].forEach(z=>add(new THREE.Mesh(new THREE.SphereGeometry(.17,12,12),B(0xfff7b0)),1.72,.85,z));
    [-.55,.55].forEach(z=>add(new THREE.Mesh(new THREE.BoxGeometry(.06,.18,.3),B(0xff2222)),-1.72,.85,z));
    const wheels=[];
    [[1.1,.85],[1.1,-.85],[-1.1,.85],[-1.1,-.85]].forEach(([x,z])=>{ const g=new THREE.Group();
      const tire=new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,.35,22),M(0x111111,{metalness:.1,roughness:.9})); tire.rotation.x=Math.PI/2;
      const rim=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.37,12),M(0xe5e7eb,{metalness:.9,roughness:.2})); rim.rotation.x=Math.PI/2;

    sc.add(car);
    const road=new THREE.Mesh(new THREE.PlaneGeometry(70,9),new THREE.MeshStandardMaterial({color:0x1f2937,roughness:.9})); road.rotation.x=-Math.PI/2; sc.add(road);
    const stripes=[]; for(let i=0;i<14;i++){ const st=new THREE.Mesh(new THREE.BoxGeometry(1.4,.02,.18),B(0xffffff)); st.position.set(0,.01,2.8); stripes.push(st); sc.add(st); }
    step=t=>{ const p=Math.min(t/4.4,1); car.position.x=-9+18*p; car.position.y=Math.abs(Math.sin(t*22))*.03; car.rotation.z=Math.sin(t*9)*.01;
      wheels.forEach(w=>w.rotation.z=-t*20); stripes.forEach((st,i)=>st.position.x=((i*4.4-t*16)%61.6+61.6)%61.6-30.8); };
  } else {
    cam.position.set(0,3,13); cam.lookAt(0,3,0);
    const rk=new THREE.Group(); rk.scale.setScalar(1.1);
    const mesh=(g,m,x,y,z)=>{ const o=new THREE.Mesh(g,m); o.position.set(x,y,z); rk.add(o); return o; };
    mesh(new THREE.CylinderGeometry(.5,.5,2.6,24),M(0xf8fafc,{metalness:.3}),0,0,0);
    mesh(new THREE.ConeGeometry(.5,1.1,24),M(0xdc2626),0,1.85,0);
    mesh(new THREE.CylinderGeometry(.52,.52,.25,24),M(0xdc2626),0,-.9,0);
    mesh(new THREE.SphereGeometry(.24,16,16),M(0x38bdf8,{metalness:.9,roughness:.1}),0,.5,.42);
    for(let i=0;i<3;i++){ const a=i*2*Math.PI/3, f=mesh(new THREE.BoxGeometry(.1,.9,.7),M(0xdc2626),Math.sin(a)*.62,-1.15,Math.cos(a)*.62); f.rotation.y=a; }
    const flame=mesh(new THREE.ConeGeometry(.34,1.5,16),B(0xfb923c),0,-2.05,0); flame.rotation.x=Math.PI;
    sc.add(rk);
    const smoke=[], parts=[], smG=new THREE.SphereGeometry(.22,8,8), pG=new THREE.SphereGeometry(.09,6,6), pM=[0xfb923c,0xef4444,0xfacc15,0xffffff].map(B);
    let boom=false, flash=null, ring=null, last=0; const UP=2.6;
    step=t=>{ const dt=Math.min(t-last,.05); last=t;
      if(t<UP){ const p=t/UP; rk.position.set(Math.sin(t*14)*.06,-6+12.8*p*p,0); rk.rotation.z=Math.sin(t*10)*.04; flame.scale.set(1+Math.random()*.25,.8+Math.random()*.6,1+Math.random()*.25);
        const s=new THREE.Mesh(smG,new THREE.MeshBasicMaterial({color:0xcbd5e1,transparent:true,opacity:.7})); s.position.set(rk.position.x,rk.position.y-2.4,0); s.life=1; smoke.push(s); sc.add(s); }

        for(let i=0;i<180;i++){ const m=new THREE.Mesh(pG,pM[i%4]); m.position.copy(ex); const a=Math.random()*Math.PI*2, b=Math.acos(2*Math.random()-1), sp=3+Math.random()*7;
          m.v=new THREE.Vector3(Math.sin(b)*Math.cos(a),Math.sin(b)*Math.sin(a),Math.cos(b)).multiplyScalar(sp); m.life=1; parts.push(m); sc.add(m); }
        document.body.append(el("div","flash")); setTimeout(()=>{ const f=document.querySelector(".flash"); if(f) f.remove(); },800); }
      for(let i=smoke.length-1;i>=0;i--){ const s=smoke[i]; s.life-=.03; s.scale.setScalar(1+(1-s.life)*2.2); s.material.opacity=Math.max(s.life,0)*.6; s.position.y-=.02; if(s.life<=0){ sc.remove(s); smoke.splice(i,1); } }
      if(boom){ const q=t-UP; flash.scale.setScalar(1+q*9); flash.material.opacity=Math.max(0,1-q*1.6); ring.scale.setScalar(1+q*14); ring.material.opacity=Math.max(0,.9-q*1.1);
        parts.forEach(m=>{ m.position.addScaledVector(m.v,dt); m.v.y-=4*dt; m.life-=dt*.55; m.scale.setScalar(Math.max(m.life,.01)); });

    };
  }
  const loop=()=>{ const t=(performance.now()-T0)/1000; step(t); r.render(sc,cam); if(t*1000<END) requestAnimationFrame(loop); else { r.dispose(); cv.remove(); } };
  loop();
}
