@keyframes gdrop{0%{transform:translateY(-62vh) rotate(-14deg);animation-timing-function:cubic-bezier(.5,0,.9,.6)}
 38%{transform:translateY(0) rotate(0) scale(1,1);animation-timing-function:ease-out}

 55%{transform:translateY(-46px) scale(.96,1.05);animation-timing-function:ease-in}
 68%{transform:translateY(0) scale(1.1,.9);animation-timing-function:ease-out}
 78%{transform:translateY(-16px) scale(1,1);animation-timing-function:ease-in}
 86%{transform:translateY(0) scale(1.04,.96)}
 100%{transform:translateY(0) scale(1,1)}}

async function loadWallet(){

async function setCoins(n){ coins=Math.max(0,r2(n)); try{ await walletRef().update({coins}); }catch(e){ await walletRef().set({coins,granted:0,earn:EARN||{}}); } }

async function spend(n,kind){

  await setCoins(coins-n); if(kind) await credit("__app__",n,kind); return true;

function watchCredits(){
  if(unsubCred.length) return;
  (OWNER?[uid,"__app__"]:[uid]).forEach(t=>unsubCred.push(db.collection("credits").where("to","==",t).onSnapshot(sn=>{ CRD[t]=sn.docs; claimCredits(); })));
}
async function claimCredits(){
  if(claimingC) return; claimingC=true;
  try{
    const all=[].concat(...Object.values(CRD)).filter(d=>!seenCred.has(d.id)); if(!all.length) return;
    let sum=0; const earn=Object.assign({},EARN);
    all.forEach(d=>{ const x=d.data(); sum+=x.amt; earn[x.kind]=r2((earn[x.kind]||0)+x.amt); seenCred.add(d.id); });
    coins=Math.max(0,r2(coins+sum)); EARN=earn; await walletRef().update({coins,earn});
    for(const d of all){ try{ await db.doc("credits/"+d.id).delete(); }catch(e){} }
    if(sum>=.01) toast("🪙 وصلك "+fmtc(sum)+" نقطة"); if(!room&&!dm) render();

}

    const eq=W.filter(c=>EQ(c.op)), rg=W.filter(c=>!EQ(c.op));
